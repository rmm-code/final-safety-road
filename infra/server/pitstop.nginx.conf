# pitstop.mardonjon.me: the web app and its object storage on one origin.
# HTTP only here; `certbot --nginx -d pitstop.mardonjon.me` adds the TLS server block.
server {
    listen 80;
    listen [::]:80;
    server_name pitstop.mardonjon.me;

    # Videos go straight to storage; Cloudflare's free plan stops at 100 MB per request.
    client_max_body_size 100m;

    # Object storage. The API signs forms and links for this host, and the signature
    # covers the Host header, so it is passed through unchanged.
    location ^~ /pothole-evidence {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
