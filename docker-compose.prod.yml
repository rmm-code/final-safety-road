# Production-shaped deployment on one server.
#
#   write .env.prod first (docs/deploy.md, "Start it")
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy is published. The database, storage, API and web server are reachable from
# each other and from nowhere else; the outside world gets HTTPS on 443 and a redirect on
# 80. See docs/deploy.md.

name: pothole-prod

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: pothole
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pothole
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pothole -d pothole"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: server /data
    environment:
      # Never the minioadmin default: storage is reachable from the internet through Caddy.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      # "production" refuses to start with AUTH_DISABLED=true. A hackathon server that
      # must run open sets ENVIRONMENT=demo instead - the guard stays where it is.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@example.com}
      DATABASE_URL: postgresql+asyncpg://pothole:${POSTGRES_PASSWORD}@postgres:5432/pothole
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET, e.g. `openssl rand -hex 32`}
      S3_ENDPOINT_URL: http://minio:9000
      # What a phone can reach. Upload forms and read links are built for this address.
      S3_PUBLIC_ENDPOINT_URL: https://s3.${DOMAIN:?set DOMAIN}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # The web app calls the API on its own origin, so this matters only for a client
      # hosted elsewhere (the Telegram Mini App, if it is ever served from another name).
      CORS_ORIGINS: https://${DOMAIN}
      PUBLIC_WEB_URL: https://${DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      CITIZEN_CONFIRMATIONS_TO_VERIFY: ${CITIZEN_CONFIRMATIONS_TO_VERIFY:-3}
      CITIZEN_IMAGES_REQUIRE_REVIEW: ${CITIZEN_IMAGES_REQUIRE_REVIEW:-true}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing it means re-issuing, and Let's Encrypt rate-limits.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - minio

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
